name: Run Tests Newman

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      
      - name: Wait for API to be ready
        run: |
          for i in {1..10}; do
            nc -z 127.0.0.1 8000 && echo "API up!" && exit 0
            sleep 2
          done
          echo "API did not start in time" && exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman tests
        run: |
          newman run newman/tests/DEVPROFILE-API.postman_collection.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export tests/newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/newman-report.html