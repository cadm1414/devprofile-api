name: Run Tests

on:
  push:
    branches:
      - main
      - feature/test-unitarios
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      API_PREFIX: "/api/v1"
      ORIGINS: "*"
      DB_NAME: "test_db"
      DB_USER: "test_user"
      DB_PASSWORD: "test_pass"
      SECRET_KEY: "secretfortests"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"  # cambia a la versión que uses en tu proyecto

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest
